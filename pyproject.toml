[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-software-evolution"
version = "0.1.0"
description = "Research Nu claims, state coordination and interactive software evolution"
requires-python = ">=3.11"
dependencies = ["tiktoken==0.14.0"]

[project.scripts]
ise = "ise.cli:main"
alf = "ise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
