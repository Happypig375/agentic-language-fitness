[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-language-fitness"
version = "0.1.0"
description = "Measure lifetime coding-agent cost across matched programming-language representations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alf = "alf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
