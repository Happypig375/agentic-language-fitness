name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Environment check
        run: alf doctor --strict
      - name: Validate matched benchmark snapshots
        run: alf validate
      - name: Run scripted chain matrix
        run: alf matrix --agent scripted --output results/ci
      - name: Summarize
        run: alf summarize results/ci --json > results/ci-summary.json
      - name: Build container
        run: docker build --tag agentic-language-fitness:ci .
      - name: Validate through container entrypoint
        run: docker run --rm agentic-language-fitness:ci validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-results
          path: results/
          if-no-files-found: warn
