name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Environment check
        run: python scripts/alf.py doctor --strict
      - name: Validate matched benchmark snapshots
        run: python scripts/alf.py validate
      - name: Check C3 representation artifacts
        run: python scripts/alf.py representation check
      - name: Validate difficulty-v1 protocol definition
        run: python scripts/alf.py protocol validate --definition protocols/difficulty-v1/definition.json
      - name: Validate C3 descriptive treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/descriptive.manifest.json validate
      - name: Validate C3 deterministic treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/deterministic.manifest.json validate
      - name: Run scripted chain matrix
        run: python scripts/alf.py matrix --agent scripted --output results/ci
      - name: Summarize
        run: python scripts/alf.py summarize results/ci --json > results/ci-summary.json
      - name: Build container
        run: docker build --tag agentic-language-fitness:ci .
      - name: Validate through container entrypoint
        run: docker run --rm agentic-language-fitness:ci validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-results-linux
          path: results/
          if-no-files-found: warn

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Environment check
        run: python scripts/alf.py doctor --strict
      - name: Validate matched benchmark snapshots
        run: python scripts/alf.py validate
      - name: Check C3 representation artifacts
        run: python scripts/alf.py representation check
      - name: Validate difficulty-v1 protocol definition
        run: python scripts/alf.py protocol validate --definition protocols/difficulty-v1/definition.json
      - name: Validate C3 descriptive treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/descriptive.manifest.json validate
      - name: Validate C3 deterministic treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/deterministic.manifest.json validate
