name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2:
        description: Run the frozen model-free E2 baseline after validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check E3a review packet and trusted model-free fixtures
        run: python scripts/e3a_check.py --build-fixtures --output results/e3a-review-fixtures-linux.json
      - name: Environment check
        run: python scripts/alf.py doctor --strict
      - name: Validate matched benchmark snapshots
        run: python scripts/alf.py validate
      - name: Check C3 representation artifacts
        run: python scripts/alf.py representation check
      - name: Check frozen Workstream E2 definition
        run: python scripts/alf.py --manifest benchmarks/successor/manifest.json e2 check --definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Check frozen Workstream E2a definition
        run: python scripts/alf.py --manifest benchmarks/successor/manifest.json e2a check --definition protocols/workstream-e2a-host-aligned-v1/definition.json --inventory protocols/workstream-e2a-host-aligned-v1/inventory.json --e2-definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Validate difficulty-v1 protocol definition
        run: python scripts/alf.py protocol validate --definition protocols/difficulty-v1/definition.json
      - name: Validate Workstream D family and child definitions
        run: |
          python scripts/alf.py protocol family-validate --definition protocols/workstream-d-language-v2/definition.json
          python scripts/alf.py protocol validate --definition protocols/workstream-d-language-v2/h.json
          python scripts/alf.py protocol validate --definition protocols/workstream-d-language-v2/m.json
          python scripts/alf.py protocol validate --definition protocols/workstream-d-language-v2/l.json
      - name: Validate C3 descriptive treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/descriptive.manifest.json validate
      - name: Validate C3 deterministic treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/deterministic.manifest.json validate
      - name: Run scripted chain matrix
        run: python scripts/alf.py matrix --agent scripted --output results/ci
      - name: Summarize
        run: python scripts/alf.py summarize results/ci --json > results/ci-summary.json
      - name: Build container
        run: docker build --tag agentic-language-fitness:ci .
      - name: Validate through container entrypoint
        run: docker run --rm agentic-language-fitness:ci validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-results-linux
          path: results/
          if-no-files-found: warn

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check E3a review packet and trusted model-free fixtures
        run: python scripts/e3a_check.py --build-fixtures --output results/e3a-review-fixtures-windows.json
      - name: Environment check
        run: python scripts/alf.py doctor --strict
      - name: Validate matched benchmark snapshots
        run: python scripts/alf.py validate
      - name: Check C3 representation artifacts
        run: python scripts/alf.py representation check
      - name: Check frozen Workstream E2 definition
        run: python scripts/alf.py --manifest benchmarks/successor/manifest.json e2 check --definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Check frozen Workstream E2a definition
        run: python scripts/alf.py --manifest benchmarks/successor/manifest.json e2a check --definition protocols/workstream-e2a-host-aligned-v1/definition.json --inventory protocols/workstream-e2a-host-aligned-v1/inventory.json --e2-definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Validate difficulty-v1 protocol definition
        run: python scripts/alf.py protocol validate --definition protocols/difficulty-v1/definition.json
      - name: Validate Workstream D family and child definitions
        run: |
          python scripts/alf.py protocol family-validate --definition protocols/workstream-d-language-v2/definition.json
          python scripts/alf.py protocol validate --definition protocols/workstream-d-language-v2/h.json
          python scripts/alf.py protocol validate --definition protocols/workstream-d-language-v2/m.json
          python scripts/alf.py protocol validate --definition protocols/workstream-d-language-v2/l.json
      - name: Validate C3 descriptive treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/descriptive.manifest.json validate
      - name: Validate C3 deterministic treatment
        run: python scripts/alf.py --manifest benchmarks/successor/representation-v1/deterministic.manifest.json validate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e3a-review-fixtures-windows
          path: results/e3a-review-fixtures-windows.json
          if-no-files-found: warn

  e2-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2 }}
    needs: [validate-linux, validate-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact-commit E2 image
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/e2/cache" "$RUNNER_TEMP/e2/raw" "$RUNNER_TEMP/e2/report" "$RUNNER_TEMP/e2/work"
          docker build \
            --iidfile "$RUNNER_TEMP/e2/image-id.txt" \
            --tag "agentic-language-fitness:e2-${GITHUB_SHA}" \
            .
      - name: Preseed the fixed NuGet package cache
        shell: bash
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            --env DOTNET_NOLOGO=1 \
            --env NUGET_PACKAGES=/e2/cache \
            --volume "$RUNNER_TEMP/e2/cache:/e2/cache" \
            "agentic-language-fitness:e2-${GITHUB_SHA}" \
            -c 'dotnet restore benchmarks/successor/repos/fsharp/v0/OrderFlow.fsproj --nologo && dotnet restore benchmarks/successor/repos/csharp/v0/OrderFlow.csproj --nologo'
      - name: Run frozen E2 baseline without external networking
        shell: bash
        run: |
          image_id="$(cat "$RUNNER_TEMP/e2/image-id.txt")"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --cpus 2 \
            --memory 6g \
            --memory-swap 6g \
            --env TMPDIR=/e2/work \
            --volume "$RUNNER_TEMP/e2/cache:/e2/cache:ro" \
            --volume "$RUNNER_TEMP/e2/raw:/e2/raw" \
            --volume "$RUNNER_TEMP/e2/report:/e2/report" \
            --volume "$RUNNER_TEMP/e2/work:/e2/work" \
            "agentic-language-fitness:e2-${GITHUB_SHA}" \
            --manifest benchmarks/successor/manifest.json \
            e2 run \
            --definition protocols/workstream-e2-toolchain-v1/definition.json \
            --runner-git-sha "$GITHUB_SHA" \
            --container-image-id "$image_id" \
            --package-cache /e2/cache \
            --raw-output /e2/raw \
            --output-json /e2/report/report.json \
            --output-markdown /e2/report/report.md
      - name: Audit report against raw evidence
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env TMPDIR=/e2/work \
            --volume "$RUNNER_TEMP/e2/raw:/e2/raw:ro" \
            --volume "$RUNNER_TEMP/e2/report:/e2/report:ro" \
            --volume "$RUNNER_TEMP/e2/work:/e2/work" \
            "agentic-language-fitness:e2-${GITHUB_SHA}" \
            --manifest benchmarks/successor/manifest.json \
            e2 audit \
            --definition protocols/workstream-e2-toolchain-v1/definition.json \
            --report /e2/report/report.json \
            --raw-output /e2/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workstream-e2-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2/image-id.txt
            ${{ runner.temp }}/e2/raw/
            ${{ runner.temp }}/e2/report/
          if-no-files-found: warn
          retention-days: 30
